<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OneJump</title>
<meta name="description" content="OneJump: the AI-powered operating system for personal trainers. Interactive prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<style>
/* Layout: a deep-green rail holding the Onejump wordmark, a bone working surface,
   and Assist (the AI copilot) marked only by the logo's volt jump arc. */
:root {
  --deep: #12281F; --green: #2F5D4E; --bone: #F4F6F1; --stone: #C6D2C8; --soft: #5B6D63;
  --volt: #D6FF3D; --volt-deep: #B4DE20;

  --bg: #EDF0E9; --surface: #FFFFFF; --surface-2: #F5F7F2; --surface-3: #E7ECE3;
  --ink: #12281F; --muted: #56685E; --faint: #84958A;
  --line: rgba(18,40,31,.10); --line-strong: rgba(18,40,31,.20);
  --rail: #12281F; --rail-2: #183428; --rail-ink: #ECF1E9; --rail-muted: rgba(236,241,233,.62);
  --primary: #12281F; --primary-hover: #1E3B2E; --on-primary: #F4F6F1;
  --assist: #D6FF3D; --on-assist: #12281F; --assist-ink: #4A6300;
  --assist-tint: rgba(214,255,61,.26); --assist-soft: rgba(214,255,61,.12); --assist-line: rgba(122,160,0,.42);
  --good: #2C7A4B; --good-tint: rgba(44,122,75,.12);
  --warn: #9A620E; --warn-tint: rgba(214,150,40,.16);
  --crit: #B23A26; --crit-tint: rgba(178,58,38,.10);
  --info: #2F5D4E; --info-tint: rgba(47,93,78,.10);
  --shadow-1: 0 1px 2px rgba(18,40,31,.05), 0 1px 1px rgba(18,40,31,.03);
  --shadow-2: 0 12px 32px -8px rgba(18,40,31,.18), 0 2px 6px rgba(18,40,31,.06);
  --scrim: rgba(10,22,17,.45);
  --chart-1: #2F5D4E; --chart-2: #9DB89F; --chart-grid: rgba(18,40,31,.08);

  --f-ui: 'Archivo', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --rail-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1611; --surface: #10201A; --surface-2: #142820; --surface-3: #1B3329;
    --ink: #E6ECE3; --muted: #9FB3A7; --faint: #6E8478;
    --line: rgba(230,236,227,.09); --line-strong: rgba(230,236,227,.18);
    --rail: #07110D; --rail-2: #0F1F18; --rail-ink: #E6ECE3; --rail-muted: rgba(230,236,227,.55);
    --primary: #D6FF3D; --primary-hover: #E2FF70; --on-primary: #12281F;
    --assist-ink: #D6FF3D; --assist-tint: rgba(214,255,61,.14); --assist-soft: rgba(214,255,61,.07); --assist-line: rgba(214,255,61,.32);
    --good: #63C68C; --good-tint: rgba(99,198,140,.14);
    --warn: #E5AE52; --warn-tint: rgba(229,174,82,.14);
    --crit: #F2826C; --crit-tint: rgba(242,130,108,.13);
    --info: #9DC7B4; --info-tint: rgba(157,199,180,.12);
    --shadow-1: 0 1px 2px rgba(0,0,0,.3);
    --shadow-2: 0 16px 40px -8px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
    --scrim: rgba(0,0,0,.6);
    --chart-1: #D6FF3D; --chart-2: #4E6E5F; --chart-grid: rgba(230,236,227,.08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1611; --surface: #10201A; --surface-2: #142820; --surface-3: #1B3329;
  --ink: #E6ECE3; --muted: #9FB3A7; --faint: #6E8478;
  --line: rgba(230,236,227,.09); --line-strong: rgba(230,236,227,.18);
  --rail: #07110D; --rail-2: #0F1F18; --rail-ink: #E6ECE3; --rail-muted: rgba(230,236,227,.55);
  --primary: #D6FF3D; --primary-hover: #E2FF70; --on-primary: #12281F;
  --assist-ink: #D6FF3D; --assist-tint: rgba(214,255,61,.14); --assist-soft: rgba(214,255,61,.07); --assist-line: rgba(214,255,61,.32);
  --good: #63C68C; --good-tint: rgba(99,198,140,.14);
  --warn: #E5AE52; --warn-tint: rgba(229,174,82,.14);
  --crit: #F2826C; --crit-tint: rgba(242,130,108,.13);
  --info: #9DC7B4; --info-tint: rgba(157,199,180,.12);
  --shadow-1: 0 1px 2px rgba(0,0,0,.3);
  --shadow-2: 0 16px 40px -8px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
  --scrim: rgba(0,0,0,.6);
  --chart-1: #D6FF3D; --chart-2: #4E6E5F; --chart-grid: rgba(230,236,227,.08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; border-radius: 6px; }
:root[data-theme="dark"] :focus-visible { outline-color: var(--volt); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) :focus-visible { outline-color: var(--volt); } }
svg.ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- type ---------- */
.display { font-stretch: 118%; font-weight: 800; letter-spacing: -.025em; }
.h1 { font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.15rem); font-stretch: 112%; font-weight: 800; letter-spacing: -.02em; }
.h2 { font-size: 1.25rem; font-stretch: 108%; font-weight: 750; letter-spacing: -.01em; }
.h3 { font-size: 1.02rem; font-weight: 700; }
.eyebrow { font-size: .72rem; font-weight: 700; font-stretch: 90%; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: .85rem; }
.tiny { font-size: .76rem; }
.num { font-variant-numeric: tabular-nums; }
.big-num { font-size: 1.9rem; font-weight: 800; font-stretch: 110%; letter-spacing: -.02em; line-height: 1.05; }
.strong { font-weight: 700; }
.nowrap { white-space: nowrap; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- layout ---------- */
.row { display: flex; align-items: center; gap: 12px; }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.s4 { gap: 4px; } .stack.s8 { gap: 8px; } .stack.s16 { gap: 16px; } .stack.s24 { gap: 24px; } .stack.s32 { gap: 32px; }
.grow { flex: 1; min-width: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .split { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 760px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) { .g4 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.hide-sm { } @media (max-width: 760px) { .hide-sm { display: none !important; } }
.show-sm { display: none !important; } @media (max-width: 760px) { .show-sm { display: initial !important; } }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.pad { padding: 20px; } .pad-sm { padding: 14px 16px; } .pad-lg { padding: 28px; }
@media (max-width: 560px) { .pad { padding: 16px; } .pad-lg { padding: 20px; } }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.card-head .h3 { display: flex; align-items: center; gap: 8px; }
.plain { background: transparent; }
.sep { height: 1px; background: var(--line); border: 0; margin: 0; }
.panel { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 650; font-size: .92rem; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { background: var(--surface-2); border-color: var(--ink); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.assist { background: var(--assist); border-color: var(--assist); color: var(--on-assist); }
.btn.assist:hover { background: var(--volt-deep); border-color: var(--volt-deep); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-3); border-color: transparent; }
.btn.danger { color: var(--crit); }
.btn.sm { height: 32px; padding: 0 12px; font-size: .84rem; }
.btn.xs { height: 26px; padding: 0 10px; font-size: .78rem; }
.btn.lg { height: 50px; padding: 0 24px; font-size: 1rem; }
.btn.icon { width: 40px; padding: 0; }
.btn.icon.sm { width: 32px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.sm svg, .btn.xs svg { width: 15px; height: 15px; }
.link { background: none; border: 0; padding: 0; color: var(--green); font-weight: 650; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
:root[data-theme="dark"] .link { color: var(--volt); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .link { color: var(--volt); } }

/* ---------- form ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: .82rem; font-weight: 650; color: var(--muted); }
.input, .select, .textarea { width: 100%; min-height: 42px; padding: 9px 12px; border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: .95rem; }
.textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--info-tint); }
.input.sm { min-height: 34px; padding: 5px 9px; font-size: .88rem; }
.hint { font-size: .8rem; color: var(--faint); }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--faint); pointer-events: none; }
.search .input { padding-left: 38px; border-radius: 999px; }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.choice { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: var(--r-md); border: 1.5px solid var(--line-strong); background: var(--surface); cursor: pointer; text-align: left; font-weight: 650; }
.choice small { font-weight: 450; color: var(--muted); font-size: .8rem; }
.choice:hover { border-color: var(--ink); }
.choice.on { border-color: var(--ink); background: var(--assist-soft); box-shadow: inset 0 0 0 1px var(--ink); }
.toggle { position: relative; width: 42px; height: 24px; flex: none; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line-strong); cursor: pointer; transition: background .15s; padding: 0; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-1); transition: transform .15s; }
.toggle.on { background: var(--green); border-color: var(--green); }
:root[data-theme="dark"] .toggle.on { background: var(--volt); border-color: var(--volt); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toggle.on { background: var(--volt); border-color: var(--volt); } }
.toggle.on::after { transform: translateX(18px); }
input[type=range] { width: 100%; accent-color: var(--green); }

/* ---------- chips & pills ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: .76rem; font-weight: 650; background: var(--surface-3); color: var(--muted); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-tint); color: var(--good); }
.pill.warn { background: var(--warn-tint); color: var(--warn); }
.pill.crit { background: var(--crit-tint); color: var(--crit); }
.pill.info { background: var(--info-tint); color: var(--info); }
.pill.assist { background: var(--assist-tint); color: var(--assist-ink); }
.pill.outline { background: transparent; border: 1px solid var(--line-strong); }
.stage { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; font-size: .64rem; font-weight: 750; letter-spacing: .05em; border: 1px solid currentColor; opacity: .85; }
.stage.mvp { color: var(--good); } .stage.v2 { color: var(--warn); } .stage.future { color: var(--faint); }
body.no-stage .stage { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: .86rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--ink); }
.chip.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.chip .count { font-size: .74rem; padding: 1px 7px; border-radius: 999px; background: var(--surface-3); color: var(--muted); }
.chip.on .count { background: rgba(255,255,255,.16); color: inherit; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; background: var(--surface-3); font-size: .76rem; font-weight: 600; color: var(--muted); }

/* ---------- avatar ---------- */
.av { --s: 36px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 750; font-size: calc(var(--s) * .36); color: #12281F; letter-spacing: .01em; position: relative; }
.av.lg { --s: 64px; } .av.md { --s: 44px; } .av.sm { --s: 28px; } .av.xs { --s: 22px; font-size: 9px; }
.av .ring { position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--crit); }
.av .ring.warn { border-color: var(--warn); }

/* ---------- the Assist mark (the logo's jump arc) ---------- */
.arc { width: 18px; height: 18px; flex: none; }
.arc path { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.arc circle { fill: currentColor; }
.assist-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--assist); color: var(--on-assist); font-size: .75rem; font-weight: 750; letter-spacing: .01em; }
.assist-badge .arc { width: 15px; height: 15px; }
.assist-card { border: 1px solid var(--assist-line); background: linear-gradient(var(--assist-soft), var(--assist-soft)), var(--surface); border-radius: var(--r-lg); }
.assist-text { color: var(--assist-ink); }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .9rem; padding: 6px 0; }
.thinking .arc path { stroke-dasharray: 30; animation: arcdraw 1.1s ease-in-out infinite; }
@keyframes arcdraw { 0% { stroke-dashoffset: 30; } 60%, 100% { stroke-dashoffset: 0; } }
.skel { border-radius: 6px; background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%; animation: sk 1.3s linear infinite; height: 12px; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .thinking .arc path, .skel { animation: none; } }

/* ---------- severity stripe rows ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li.click { cursor: pointer; } .li.click:hover { background: var(--surface-2); }
@media (max-width: 560px) { .li { padding: 12px 16px; } }
.sev { position: relative; }
.sev::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--line-strong); }
.sev.crit::before { background: var(--crit); } .sev.warn::before { background: var(--warn); } .sev.good::before { background: var(--good); } .sev.assist::before { background: var(--volt-deep); }

/* ---------- KPI strip ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.kpi { padding: 16px 20px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .delta { font-size: .8rem; font-weight: 650; }
.delta.up { color: var(--good); } .delta.down { color: var(--crit); }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } .kpi:nth-child(3) { border-left: 0; } .kpi:nth-child(n+3) { border-top: 1px solid var(--line); } }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
.t th { text-align: left; font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t td.r, .t th.r { text-align: right; }
.t tr.click { cursor: pointer; } .t tr.click:hover td { background: var(--surface-2); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; padding: 12px 12px; background: none; border: 0; font-weight: 650; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: .92rem; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); }
.tab.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--ink); }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-3); gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 650; font-size: .84rem; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* ---------- app shell (trainer + admin) ---------- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: 0; height: 100vh; height: 100dvh; background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; padding: 20px 14px 14px; overflow-y: auto; }
.rail .brand { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px 18px; }
.rail .brand svg.wordmark { height: 24px; width: auto; color: var(--bone); }
.rail .brand .ws { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--rail-muted); }
.rail .biz { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 14px; border-radius: 12px; background: var(--rail-2); }
.rail .biz .logo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--volt); color: var(--deep); font-weight: 800; font-size: .8rem; font-stretch: 110%; }
.rail .group-label { font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--rail-muted); padding: 14px 12px 6px; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 12px; border-radius: 10px; border: 0; background: transparent; color: var(--rail-ink); font-weight: 600; font-size: .92rem; cursor: pointer; text-align: left; opacity: .82; }
.nav-item svg { width: 19px; height: 19px; flex: none; }
.nav-item:hover { background: rgba(255,255,255,.06); opacity: 1; }
.nav-item.on { background: rgba(214,255,61,.13); opacity: 1; color: #fff; }
.nav-item.on svg { color: var(--volt); }
.nav-item .badge { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--volt); color: var(--deep); font-size: .72rem; font-weight: 800; display: grid; place-items: center; }
.nav-item .stage { margin-left: auto; color: var(--rail-muted); }
.nav-item .badge + .stage { margin-left: 6px; }
.rail .foot { margin-top: auto; padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.rail .me { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; }
.rail .me:hover { background: rgba(255,255,255,.05); }
.rail .saved { padding: 12px; border-radius: 12px; border: 1px solid rgba(214,255,61,.22); background: rgba(214,255,61,.06); font-size: .82rem; color: var(--rail-muted); }
.rail .saved b { color: var(--volt); font-size: 1.15rem; display: block; font-stretch: 110%; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .search { flex: 1; max-width: 420px; }
.topbar .kbd { position: absolute; right: 12px; top: 50%; translate: 0 -50%; font-size: .72rem; color: var(--faint); border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 6px; }
.content { padding: 28px; padding-bottom: 96px; max-width: 1320px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); margin-top: 6px; }
.bell { position: relative; }
.bell .dot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--crit); border: 2px solid var(--bg); }
.mobile-only { display: none; }
.tabbar { display: none; }
@media (max-width: 1023px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 60; left: 0; top: 0; width: 280px; transform: translateX(-100%); transition: transform .2s; padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  body.rail-open .rail { transform: none; box-shadow: var(--shadow-2); }
  body.rail-open .rail-scrim { display: block; }
  .mobile-only { display: inline-flex; }
  .topbar { padding: 0 16px; }
  .content { padding: 20px 16px 110px; }
}
.rail-scrim { display: none; position: fixed; inset: 0; z-index: 55; background: var(--scrim); }
@media (max-width: 640px) {
  .topbar .search { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
  .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; font-size: .68rem; font-weight: 650; color: var(--muted); cursor: pointer; position: relative; }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button.on { color: var(--ink); }
  .tabbar button .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--crit); color: #fff; font-size: .62rem; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }
}

/* ---------- Today queue ---------- */
.q-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 14px; padding: 16px 20px; border-top: 1px solid var(--line); align-items: start; }
.q-item:first-child { border-top: 0; }
.q-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-3); color: var(--ink); }
.q-icon svg { width: 20px; height: 20px; }
.q-icon.crit { background: var(--crit-tint); color: var(--crit); }
.q-icon.warn { background: var(--warn-tint); color: var(--warn); }
.q-icon.assist { background: var(--assist-tint); color: var(--assist-ink); }
.q-icon.good { background: var(--good-tint); color: var(--good); }
.q-actions { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; }
.q-draft { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--assist-line); font-size: .9rem; }
.q-done { opacity: .55; }
@media (max-width: 640px) { .q-actions { grid-column: 1 / -1; } }

/* ---------- client cards ---------- */
.client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.cc { display: flex; flex-direction: column; gap: 14px; padding: 18px; cursor: pointer; transition: border-color .15s, transform .15s; text-align: left; }
.cc:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.cc .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; font-size: .84rem; }
.cc .meta dt { color: var(--faint); font-size: .74rem; font-weight: 600; }
.cc .meta dd { margin: 0; font-weight: 600; }
.bar { height: 6px; border-radius: 6px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: var(--green); }
:root[data-theme="dark"] .bar > i { background: var(--volt); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar > i { background: var(--volt); } }
.bar.warn > i { background: var(--warn); } .bar.crit > i { background: var(--crit); }

/* ---------- client profile ---------- */
.profile-head { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; }
.stat { padding: 14px 18px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.photo { aspect-ratio: 3/4; max-width: 100%; border-radius: var(--r-md); background: var(--surface-3); display: grid; place-items: end start; padding: 10px; position: relative; overflow: hidden; }
.photo svg { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--stone); }
.photo span { position: relative; font-size: .76rem; font-weight: 700; background: var(--surface); padding: 2px 8px; border-radius: 6px; }

/* ---------- builder ---------- */
.builder { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .builder { grid-template-columns: minmax(0, 1fr); } }
.lib-list { max-height: 560px; overflow-y: auto; }
.lib-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); cursor: grab; }
.lib-item:hover { background: var(--surface-2); }
.thumb { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-3); display: grid; place-items: center; flex: none; color: var(--muted); }
.thumb svg { width: 18px; height: 18px; }
.block { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.block.dragging { opacity: .4; }
.block.over { box-shadow: 0 -3px 0 var(--green) inset; }
.block-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.block-head .grip { cursor: grab; color: var(--faint); display: grid; }
.block-letter { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); font-weight: 800; font-size: .8rem; flex: none; }
.group-box { border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.group-label { font-size: .74rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 2px 4px; }
.sets { width: 100%; border-collapse: collapse; font-size: .86rem; }
.sets th { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 700; padding: 6px 6px; text-align: left; }
.sets td { padding: 4px 6px; border-top: 1px solid var(--line); }
.sets input { width: 100%; min-width: 52px; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 6px; }
.sets input:hover { border-color: var(--line-strong); }
.sets input:focus { outline: none; border-color: var(--green); background: var(--surface); }

/* ---------- messaging ---------- */
.inbox { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: calc(100dvh - 236px); min-height: 520px; overflow: hidden; }
.inbox .threads { border-right: 1px solid var(--line); overflow-y: auto; }
.thread { display: flex; gap: 12px; padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
.thread:hover { background: var(--surface-2); }
.thread.on { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--ink); }
.thread .unread { width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-top: 6px; flex: none; }
:root[data-theme="dark"] .thread .unread { background: var(--volt); }
.convo { display: flex; flex-direction: column; min-width: 0; }
.convo .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: min(560px, 82%); padding: 10px 14px; border-radius: 16px; font-size: .93rem; line-height: 1.45; }
.bubble.them { background: var(--surface-2); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble.me { background: var(--primary); color: var(--on-primary); align-self: flex-end; border-bottom-right-radius: 4px; }
.bubble .time { display: block; font-size: .7rem; opacity: .6; margin-top: 4px; }
.day-sep { align-self: center; font-size: .72rem; font-weight: 700; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; padding: 6px 0; }
.composer { border-top: 1px solid var(--line); padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.assist-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
.assist-bar::-webkit-scrollbar { display: none; }
.assist-bar .chip { height: 30px; font-size: .8rem; padding: 0 11px; border-color: var(--assist-line); background: var(--assist-soft); }
.assist-bar .chip:hover { background: var(--assist-tint); border-color: var(--assist-ink); }
.ctx-pane { border-left: 1px solid var(--line); padding: 18px; overflow-y: auto; }
@media (max-width: 900px) {
  .inbox { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 0; }
  .inbox .threads { border-right: 0; max-height: none; }
  .inbox.has-thread .threads { display: none; }
  .inbox:not(.has-thread) .convo { display: none; }
  .convo .msgs { max-height: 55dvh; }
}

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: 56px repeat(7, minmax(110px, 1fr)); min-width: 860px; }
.cal .col-head { padding: 10px 8px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); text-align: center; position: sticky; top: 0; background: var(--surface); z-index: 2; }
.cal .col-head.today .dn { background: var(--primary); color: var(--on-primary); }
.cal .dn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font-weight: 750; font-size: 1rem; }
.cal .hour { height: 52px; font-size: .7rem; color: var(--faint); text-align: right; padding: 0 8px; transform: translateY(-7px); }
.cal .day { position: relative; border-left: 1px solid var(--line); }
.cal .slot { height: 52px; border-top: 1px solid var(--line); }
.cal .slot.avail { background: var(--assist-soft); }
.cal .slot:hover { background: var(--surface-2); cursor: copy; }
.ev { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 5px 8px; font-size: .76rem; line-height: 1.25; cursor: pointer; overflow: hidden; border-left: 3px solid var(--green); background: var(--info-tint); color: var(--ink); }
.ev b { display: block; font-size: .8rem; }
.ev.video { border-left-color: var(--volt-deep); background: var(--assist-tint); }
.ev.consult { border-left-color: var(--warn); background: var(--warn-tint); }
.ev.cancelled { opacity: .5; text-decoration: line-through; }

/* ---------- kanban ---------- */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.kcol { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 300px; }
.kcol.over { border-color: var(--green); background: var(--assist-soft); }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; cursor: grab; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-1); }

/* ---------- charts ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--faint); font-size: 11px; font-family: var(--f-ui); }
.chart .grid-l { stroke: var(--chart-grid); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--chart-1); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .line2 { fill: none; stroke: var(--chart-2); stroke-width: 2; stroke-dasharray: 4 4; }
.chart .area { fill: var(--chart-1); opacity: .10; }
.chart .bar-a { fill: var(--chart-1); }
.chart .bar-b { fill: var(--chart-2); }
.chart .bar-neg { fill: var(--crit); opacity: .8; }
.chart .end { fill: var(--chart-1); stroke: var(--surface); stroke-width: 3; }
.chart .end-label { fill: var(--ink); font-weight: 700; font-size: 12px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.spark { width: 100%; height: 36px; display: block; }
.spark path.l { fill: none; stroke: var(--chart-1); stroke-width: 2; }
.spark path.a { fill: var(--chart-1); opacity: .1; }

/* ---------- modal / drawer / toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 80; background: var(--scrim); display: grid; place-items: center; padding: 16px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-2); border: 1px solid var(--line); }
.modal.wide { width: min(880px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.modal-body { padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); flex-wrap: wrap; }
.drawer { position: fixed; z-index: 70; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-2); display: flex; flex-direction: column; animation: slidein .2s ease-out; padding-top: env(safe-area-inset-top, 0px); }
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.drawer-foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.toasts { position: fixed; z-index: 100; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; display: flex; flex-direction: column; gap: 8px; align-items: center; width: max-content; max-width: calc(100% - 32px); }
.toast { display: flex; align-items: center; gap: 12px; padding: 11px 14px 11px 16px; border-radius: 14px; background: var(--deep); color: var(--bone); box-shadow: var(--shadow-2); font-size: .9rem; font-weight: 550; animation: up .2s ease-out; }
.toast .arc { color: var(--volt); }
.toast button { background: none; border: 0; color: var(--volt); font-weight: 750; cursor: pointer; padding: 2px 4px; }
@keyframes up { from { transform: translateY(10px); opacity: 0; } }
@media (max-width: 640px) { .toasts { bottom: calc(82px + env(safe-area-inset-bottom, 0px)); } }

/* ---------- chat (assist) ---------- */
.chat { display: flex; flex-direction: column; gap: 16px; }
.chat .q { align-self: flex-end; max-width: 85%; background: var(--primary); color: var(--on-primary); padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-weight: 550; }
.chat .a { display: flex; gap: 12px; align-items: flex-start; }
.chat .a .who { width: 30px; height: 30px; border-radius: 50%; background: var(--assist); color: var(--on-assist); display: grid; place-items: center; flex: none; }
.chat .a .who .arc { width: 17px; height: 17px; }
.chat .a .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.trace { display: flex; gap: 6px; flex-wrap: wrap; }
.trace span { font-size: .72rem; font-weight: 650; color: var(--faint); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest button { text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: .86rem; font-weight: 600; cursor: pointer; }
.suggest button:hover { border-color: var(--ink); }

/* ---------- prototype switcher ---------- */
.proto-fab { position: fixed; z-index: 90; right: 0; top: 50%; translate: 0 -50%; display: inline-flex; align-items: center; gap: 8px; writing-mode: vertical-rl; padding: 14px 7px; border-radius: 12px 0 0 12px; border: 1px solid rgba(214,255,61,.35); border-right: 0; background: #0B1A13; color: #ECF1E9; font-weight: 700; font-size: .78rem; letter-spacing: .04em; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.proto-fab svg { width: 16px; height: 16px; color: var(--volt); }
.proto-sheet { position: fixed; z-index: 95; right: 44px; top: 50%; translate: 0 -50%; width: min(380px, calc(100% - 32px)); max-height: min(640px, calc(100dvh - 100px)); overflow-y: auto; background: #0B1A13; color: #ECF1E9; border: 1px solid rgba(214,255,61,.25); border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.45); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.proto-sheet h4 { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: rgba(236,241,233,.55); font-weight: 700; margin-bottom: 6px; }
.proto-sheet .links { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.proto-sheet .links button { text-align: left; background: transparent; border: 0; color: #ECF1E9; padding: 7px 8px; border-radius: 8px; font-size: .84rem; font-weight: 550; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.proto-sheet .links button:hover { background: rgba(255,255,255,.07); }
.proto-sheet .links button.on { background: rgba(214,255,61,.14); color: var(--volt); }
.proto-sheet .links button i { font-style: normal; font-size: .68rem; color: rgba(236,241,233,.4); width: 16px; }
.proto-sheet .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .84rem; }
.proto-sheet .seg { background: rgba(255,255,255,.08); }
.proto-sheet .seg button { color: rgba(236,241,233,.7); }
.proto-sheet .seg button.on { background: var(--volt); color: var(--deep); }
@media (max-width: 640px) { .proto-sheet { right: 40px; width: min(380px, calc(100% - 56px)); } }

/* ---------- upsell / empty ---------- */
.upsell { display: flex; gap: 18px; align-items: center; padding: 22px; border-radius: var(--r-lg); border: 1px solid var(--assist-line); background: var(--assist-soft); flex-wrap: wrap; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 40px 20px; color: var(--muted); }
.empty .arc { width: 40px; height: 40px; color: var(--volt-deep); }
.lock { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 750; color: var(--assist-ink); background: var(--assist-tint); padding: 2px 7px; border-radius: 6px; }

/* ---------- public pages ---------- */
.pub { min-height: 100%; background: var(--bg); }
.pub-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px clamp(16px, 4vw, 48px); background: var(--deep); color: var(--bone); }
.pub-nav svg.wordmark { height: 24px; width: auto; color: var(--bone); }
.pub-nav .links { display: flex; gap: 24px; font-size: .9rem; font-weight: 600; }
.pub-nav .links a { text-decoration: none; opacity: .8; cursor: pointer; } .pub-nav .links a:hover { opacity: 1; }
@media (max-width: 860px) { .pub-nav .links { display: none; } }
.hero { background: var(--deep); color: var(--bone); padding: clamp(40px, 7vw, 88px) clamp(16px, 4vw, 48px) 0; overflow: hidden; }
.hero-in { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(28px, 4vw, 56px); align-items: end; }
@media (max-width: 960px) { .hero-in { grid-template-columns: minmax(0, 1fr); } }
.hero h1 { font-size: clamp(2.6rem, 1.6rem + 4.4vw, 5rem); line-height: .98; font-stretch: 122%; font-weight: 850; letter-spacing: -.035em; }
.hero h1 .jump { position: relative; display: inline-block; }
.hero h1 .jump-line { display: inline-block; padding-top: .34em; }

/* ---------- charts (hand-rolled SVG, one scale per chart) ---------- */
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function lineChart({ labels, series, height = 220, fmt = v => v, min = null, endLabel = true, compare = null }) {
  const W = 640, H = height, pl = 48, pr = 56, pt = 16, pb = 28;
  const all = series.concat(compare || []);
  let lo = min ?? Math.min(...all), hi = Math.max(...all);
  if (min == null) { const pad = (hi - lo) * .15 || 1; lo -= pad; hi += pad; }
  else hi *= 1.06;
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const ticks = Math.round((hi - lo) / step);
  const x = i => pl + i * (W - pl - pr) / (labels.length - 1);
  const y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  let g = '';
  for (let i = 0; i <= ticks; i++) { const v = lo + step * i; g += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(Math.round(v * 100) / 100)}</text>`; }
  const every = Math.ceil(labels.length / 7);
  labels.forEach((l, i) => { if (i % every === 0 || i === labels.length - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`; });
  const d = series.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  const area = `${d}L${x(series.length - 1)} ${y(lo)}L${x(0)} ${y(lo)}Z`;
  const cmp = compare ? `<path class="line2" d="${compare.map((v, i) => `${i ? 'L' : 'M'}${x(i)} ${y(v)}`).join('')}"/>` : '';
  const li = series.length - 1;
  const end = endLabel ? `<circle class="end" cx="${x(li)}" cy="${y(series[li])}" r="5"/><text class="end-label" x="${x(li) + 9}" y="${y(series[li]) + 4}">${fmt(series[li])}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<path class="area" d="${area}"/>${cmp}<path class="line" d="${d}"/>${end}</svg>`;
}
function barChart({ labels, a, b = null, neg = null, height = 200, fmt = v => v }) {
  const W = 640, H = height, pl = 40, pr = 12, pt = 12, pb = 28;
  const mx = Math.max(...a, ...(b || [0])), step = Math.max(1, niceStep(mx / 4));
  const hi = Math.ceil(mx * 1.05 / step) * step;
  const lo = neg ? -niceMax(Math.max(...neg) * 1.4) : 0;
  const nT = Math.round((hi - lo) / step);
  const y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const bw = (W - pl - pr) / labels.length;
  let g = '';
  for (let i = 0; i <= nT; i++) { const v = lo + step * i; g += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(Math.round(v))}</text>`; }
  labels.forEach((l, i) => {
    const cx = pl + bw * i + bw / 2, w = b ? bw * .32 : bw * .56;
    if (b) {
      g += `<rect class="bar-a" x="${cx - w - 1}" y="${y(a[i])}" width="${w}" height="${y(0) - y(a[i])}" rx="3"/>`;
      g += `<rect class="bar-b" x="${cx + 1}" y="${y(b[i])}" width="${w}" height="${y(0) - y(b[i])}" rx="3"/>`;
    } else g += `<rect class="bar-a" x="${cx - w / 2}" y="${y(a[i])}" width="${w}" height="${y(0) - y(a[i])}" rx="3"/>`;
    if (neg && neg[i]) g += `<rect class="bar-neg" x="${cx - w / 2}" y="${y(0)}" width="${w}" height="${y(-neg[i]) - y(0)}" rx="3"/>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function sparkline(vals, w = 120, h = 36) {
  const lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;
  const x = i => i * (w / (vals.length - 1)), y = v => 3 + (1 - (v - lo) / r) * (h - 6);

  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path class="a" d="${d}L${w} ${h}L0 ${h}Z"/><path class="l" d="${d}"/></svg>`;
}

/* ============================================================
   SERVICES — the same seams the production app will have.
   AuthService · Data (tenant-scoped repo) · RiskEngine (deterministic)
   AIService → LLMProvider (MockProvider here; Anthropic/OpenAI later)
   PaymentService (Stripe-shaped mock) · SafetyGuard
   ============================================================ */

/* ---------- Auth: who is asking, and for which business ---------- */
const AuthService = {
  sessions: {
    trainer: { userId: 'u1', role: 'owner', biz: 'b1' },
    client: { userId: 'uc1', role: 'client', biz: 'b1', clientId: 'c1' },
    admin: { userId: 'ua', role: 'platform_admin', biz: null },
  },
  current: 'trainer',
  session() { return this.sessions[this.current]; },
  as(kind) { this.current = kind; },
};

/* ---------- Data: every read is scoped like Postgres row-level security ---------- */
const Data = {
  scoped(s = AuthService.session()) {
    const own = r => r.biz === s.biz || r.biz === null;
    const canSeeClient = c => own(c) && (s.role !== 'client' || c.id === s.clientId);
    const clients = () => DB.clients.filter(c => c.biz && canSeeClient(c));
    return {
      session: s,
      business: () => DB.businesses.find(b => b.id === s.biz),
      clients,
      client: id => clients().find(c => c.id === id) || null,
      activeClients: () => clients().filter(c => c.status === 'active' || c.status === 'new'),
      package: id => DB.packages.find(k => k.id === id && own(k)),
      packages: () => DB.packages.filter(own),
      program: id => DB.programs.find(p => p.id === id && own(p)),
      programs: () => DB.programs.filter(own),
      exercises: () => DB.exercises.filter(own),
      exercise: id => DB.exercises.find(e => e.id === id),
      checkins: () => DB.checkins.filter(k => own(k) && canSeeClient(Data.raw(k.client))),
      thread: cid => (canSeeClient(Data.raw(cid)) ? DB.threads.find(t => t.client === cid) : null),
      threads: () => DB.threads.filter(t => canSeeClient(Data.raw(t.client))),
      appointments: () => DB.appointments.filter(a => own(a) && (s.role !== 'client' || a.client === s.clientId)),
      payments: () => DB.payments.filter(p => own(p) && (s.role !== 'client' || p.client === s.clientId)),
      leads: () => s.role === 'client' ? [] : DB.leads.filter(own),
      referrals: () => DB.referrals.filter(own),
      automations: () => s.role === 'client' ? [] : DB.automations.filter(own),
      /* proves isolation: how many records exist that this session is NOT allowed to read */
      hiddenCount: () => DB.clients.filter(c => c.biz && c.biz !== s.biz).length + DB.businesses.filter(b => b.id !== s.biz).length,
    };
  },
  raw: id => DB.clients.find(c => c.id === id),
};
const D = () => Data.scoped();

/* ---------- Risk: computed in code, explained by AI ---------- */
const RiskEngine = {
  score(c) {
    const s = c.signals; if (!s) return null;
    const parts = [];
    if (s.missed14) parts.push([Math.min(35, s.missed14 * 7), `Missed ${plural(s.missed14, 'workout')} in the last 14 days`]);
    if (s.checkinMiss) parts.push([Math.min(24, s.checkinMiss * 12), s.checkinMiss > 1 ? `No check-in for ${s.checkinMiss} weeks` : 'Didn’t send last week’s check-in']);
    if (s.msgDrop >= .4) parts.push([12, `Messaging ${Math.round(s.msgDrop * 100)}% less than usual`]);
    else if (s.msgDrop >= .25) parts.push([6, `Messaging ${Math.round(s.msgDrop * 100)}% less than usual`]);
    if (s.sentiment === 'negative') parts.push([15, c.quote ? `Said “${c.quote}”` : 'Frustrated tone in recent messages']);
    if (s.plateau >= 3) parts.push([10, `Weight flat for ${s.plateau} weeks`]);
    else if (s.plateau === 2) parts.push([5, 'Progress slowing for 2 weeks']);
    if (s.payFailed) parts.push([15, 'Latest payment failed']);
    if (c.adherence < 60) parts.push([10, `Adherence ${c.adherence}% over 4 weeks`]);
    else if (c.adherence < 75) parts.push([5, `Adherence ${c.adherence}% over 4 weeks`]);
    const score = Math.min(96, sum(parts.map(p => p[0])));
    const level = score >= 65 ? 'high' : score >= 40 ? 'medium' : 'low';
    return { score, level, reasons: parts.sort((a, b) => b[0] - a[0]).map(p => p[1]) };
  },
};
DB.clients.forEach(c => { c.risk = RiskEngine.score(c); });

/* ---------- Safety: Assist coaches, it never diagnoses ---------- */
const SafetyGuard = {
  terms: /\b(pain|hurt|hurts|hurting|injur\w*|sprain|tear|torn|doctor|medication|meds|pregnan\w*|dizzy|faint\w*|chest pain|numb\w*|surgery|diagnos\w*)\b/i,
  check(text) { const m = String(text || '').match(this.terms); return m ? { flagged: true, term: m[0] } : { flagged: false }; },
  referral: 'Because this involves pain, I’d like you to get it checked by a physical therapist or sports-medicine doctor before we load it again.',
};

/* ---------- LLM providers: one interface, swappable by env ---------- */
class LLMProvider { async complete(_req) { throw new Error('not implemented'); } }
class MockProvider extends LLMProvider {
  constructor() { super(); this.name = 'Mock (local)'; this.calls = 0; }
  async complete(req) {
    this.calls++;
    await sleep(req.latency ?? (650 + Math.random() * 650));
    const out = MockTemplates[req.task](req.input);
    return out;
  }
}
/* AnthropicProvider / OpenAIProvider would POST {system, prompt, schema} from the server,
   reading the key from process.env (AI_PROVIDER, ANTHROPIC_API_KEY…). Never from the browser. */

class AIService {
  constructor(provider) { this.provider = provider; this.promptVersion = 'v0.3'; }
  run(task, input, latency) { return this.provider.complete({ task, input, latency, system: `onejump/${task}@${this.promptVersion}`, schema: task }); }
  generateWorkout(brief) { return this.run('workout', brief, 1400); }
  suggestAdjustments(client) { return this.run('adjust', client); }
  analyzeCheckIn(checkin) { return this.run('checkin', checkin); }
  draftMessage(intent, client, current = '') { return this.run('message', { intent, client, current }, 800); }
  analyzeClientRisk(client) { return this.run('risk', client); }
  generateProgram(prompt) { return this.run('program', prompt, 1800); }
  analyzeProgress(client) { return this.run('progress', client); }
  analyzeBusiness(question, ctx = {}) { return this.run('business', { question, ctx }, 900); }
}
const AI = new AIService(new MockProvider());

/* ---------- Payments: Stripe-shaped mock ---------- */
const PaymentService = {
  provider: 'Stripe (test mode mock)',
  async retry(id) {
    await sleep(900);
    const p = DB.payments.find(x => x.id === id);
    if (!p) return { ok: false, error: 'Payment not found' };
    p.attempts = (p.attempts || 0) + 1;
    if (p.reason && p.reason.includes('expired')) return { ok: false, error: 'Card expired. The client needs to add a new card.' };
    return { ok: false, error: 'Card declined again. A reminder is the next step.' };
  },
  async sendReminder(id) { await sleep(500); const p = DB.payments.find(x => x.id === id); if (p) p.reminded = true; return { ok: true }; },
  async createPackage(pkg) { await sleep(500); const k = { id: uid('k'), biz: AuthService.session().biz, active: 0, ...pkg }; DB.packages.push(k); return k; },
  mrr() { return sum(D().activeClients().filter(c => ['paid', 'failed', 'due'].includes(c.pay)).map(c => D().package(c.plan).price)); },
};

/* ---------- small derived helpers used across views ---------- */
const first = c => c.name.split(' ')[0];
const pkgOf = c => D().package(c.plan);
const progOf = c => D().program(c.program);
const isPaying = c => ['paid', 'failed', 'due'].includes(c.pay) && (c.status === 'active' || c.status === 'new');
function weightDelta(c) { const w = c.weight; return Math.round((w[w.length - 1] - w[0]) * 10) / 10; }

/* ============================================================
   MOCK TEMPLATES — what the model would return, as structured
   objects that match each method's JSON schema.
   ============================================================ */
const MockTemplates = {
  checkin(k) {
    const c = Data.raw(k.client), f = first(c);
    const safety = SafetyGuard.check(k.text);
    const flags = [], wins = [];
    if (k.soreness >= 7) flags.push({ level: 'warn', text: k.prev.soreness >= 7 || c.signals?.soreHigh >= 2 ? 'Soreness 8/10 for 2 weeks running' : `Soreness up to ${k.soreness}/10` });
    if (k.sleep < k.prev.sleep - .4) flags.push({ level: 'warn', text: `Sleep down to ${k.sleep} h (from ${k.prev.sleep} h)` });
    if (k.nutrition <= 5) flags.push({ level: 'warn', text: `Nutrition adherence ${k.nutrition}/10` });
    if (c.signals?.plateau >= 3) flags.push({ level: 'warn', text: `Weight flat for ${c.signals.plateau} weeks` });
    if (safety.flagged) flags.unshift({ level: 'crit', text: 'Reports knee pain during squats' });
    const dw = Math.round((k.weight - c.weight[c.weight.length - 2]) * 10) / 10;
    if (dw < 0) wins.push(`Down ${Math.abs(dw)} lb this week (${Math.abs(weightDelta(c))} lb total)`);
    if (k.workouts[0] === k.workouts[1]) wins.push(`All ${k.workouts[1]} workouts done`);
    if (c.id === 'c8') wins.push('285 lb triple on back squat, a new best');

    let summary, actions;
    if (c.id === 'c1') {
      summary = `${f} completed 3 of 4 workouts and is down another 1.4 lb (8.6 lb since July). Lower-body soreness has been 8/10 for two weeks while his sleep fell to 6.4 hours. Consider reducing leg volume this week and putting the focus on recovery.`;
      actions = [
        { kind: 'adjust', label: 'Reduce lower-body volume about 25% this week', detail: 'Remove 1 set from goblet squats, RDLs and split squats. Keep load and RPE 7.', mins: 12 },
        { kind: 'habit', label: 'Add a 7-hour sleep target to his habits', detail: 'He’ll see it as a daily check in his app.', mins: 3 },
        { kind: 'reply', label: 'Send the drafted reply', mins: 6 },
      ];
    } else if (c.id === 'c8') {
      summary = `${f} completed all 4 workouts and hit a 285 lb triple. He reports sharp pain on the inside of his left knee when descending in squats since Thursday and trained through it. Pain is outside coaching scope: recommend he sees a physical therapist or sports-medicine doctor before loading deep squats again.`;
      actions = [
        { kind: 'adjust', label: 'Pause back squats until he’s been assessed', detail: 'Optional, your call: box squat to a pain-free depth, or upper-body and hinge work only. Assist won’t suggest loading through pain.', mins: 10 },
        { kind: 'reply', label: 'Send the drafted reply (includes referral)', mins: 6 },
        { kind: 'note', label: 'Add a note to his profile: knee pain reported Oct 6', mins: 2 },
      ];
    } else if (c.id === 'c6') {
      summary = `${f} trained 3 of 4 times despite 3 days on the road. His weight has been within 0.5 lb for 4 weeks and nutrition adherence dropped to 5/10 with restaurant meals. He sounds frustrated, so the reply matters more than the program this week.`;
      actions = [
        { kind: 'adjust', label: 'Add a 30-minute hotel-gym workout to his program', detail: 'Dumbbells and bodyweight only, for travel days.', mins: 15 },
        { kind: 'habit', label: 'Set a simple travel-day protein target', detail: 'Example: protein at every meal. You set the number.', mins: 4 },
        { kind: 'reply', label: 'Send the drafted reply', mins: 6 },
      ];
    } else {
      summary = `${f} completed ${k.workouts[0]} of ${k.workouts[1]} workouts with good energy (${k.energy}/10) and sleep (${k.sleep} h). Nothing needs changing; a short note of encouragement is enough.`;
      actions = [{ kind: 'reply', label: 'Send the drafted reply', mins: 4 }];
    }
    const reply = MockTemplates.message({ intent: 'checkin-reply', client: c }).text;
    return { summary, flags, wins, actions, reply, safety, metrics: { sleep: k.sleep, energy: k.energy, soreness: k.soreness, stress: k.stress, nutrition: k.nutrition, workouts: k.workouts } };
  },

  message({ intent, client: c, current }) {
    const f = c ? first(c) : 'there';
    const T = {
      'checkin-reply': {
        c1: `Thanks for the check-in, ${f}. Down another 1.4 lb is great work during a crazy week. Two weeks of 8/10 soreness plus short sleep tells me we should pull back a little, so I’ve trimmed one set from each leg exercise this week. Same weights, less volume. Aim for 7 hours of sleep where you can. How’s the rest of the week looking?`,
        c8: `285 for a clean triple is a big deal, nice work. About the knee: because it’s sharp pain on the way down, I don’t want you training through it. Please get it checked by a physical therapist or sports-medicine doctor before we load squats again. Until then we’ll keep training around it with upper body and hinges. Let me know what they say.`,
        c6: `I know the scale sitting still is frustrating, Tom. Three workouts in hotel gyms during a travel week is exactly the consistency that pays off. A month at the same weight usually means food on busy days is the lever, not more training. I added a 30-minute hotel workout and a simple protein-at-every-meal goal for road days. Want to do a quick call this week to plan your next trip?`,
        _: `Great week, ${f}. Everything is moving in the right direction, so we’ll keep the plan as is. Keep it up!`,
      },
      motivate: `Hey ${f}! Quick reminder of how far you’ve come: ${c?.completed || 'a lot of'} workouts done${c && weightDelta(c) < 0 ? ` and ${Math.abs(weightDelta(c))} lb down` : ''}. The work you’re doing now is what gets you to “${c?.goal?.toLowerCase() || 'your goal'}”. One session at a time. I’m proud of you.`,
      professional: `Hi ${f}, thanks for the update. I’ve reviewed your last week and I’ll keep your program on track for week ${c?.week || ''}. If anything changes with your schedule, let me know and I’ll adjust it.`,
      consistency: `${f}, the clients who get results aren’t the ones with perfect weeks. They’re the ones who keep showing up after an imperfect one. Even two short sessions this week keeps the momentum going. What’s one session you can lock in?`,
      recovery: `Recovery tip for this week, ${f}: keep your sessions at an easier effort (about RPE 6), walk 20–30 minutes on rest days, and aim for 7+ hours of sleep. Soreness should ease within a few days. If anything feels like pain rather than soreness, tell me.`,
      'checkin-reminder': `Hey ${f}! Just checking in. I noticed you haven’t sent your weekly check-in yet. How are you feeling this week?`,
      risk: {
        c2: `Hey Sarah, I noticed the last couple of weeks have been tough to fit training in, which is completely normal with rotating shifts. Would 3 shorter sessions a week work better for now? Tell me what your schedule looks like and I’ll rebuild the plan around it.`,
        c3: `Hey Marcus, I’ve been thinking about what you said, and you’re right that the plan has to fit your life, not the other way round. Can we do 15 minutes on Friday at 6? I’ll bring a lighter version built around your work hours. June is very doable from here.`,
        c15: `Hi Grace, how are you doing? I know the last couple of weeks have been busy with the grandkids. Would it help to switch your check-in to Sunday evenings and shorten sessions to 30 minutes for a while?`,
        c18: `Hi Kevin, how are the first couple of weeks feeling? I noticed a couple of missed sessions, which is normal at the start. What’s been the hardest part to fit in?`,
        c6: `Hey Tom, I can tell the plateau is getting to you, and that’s fair. Let’s do a 15-minute call this week and make a simple plan for travel weeks. You’re doing the hard part already.`,
        _: `Hey ${f}, just checking in. How are things going with training lately?`,
      },
      payment: `Hi ${f}, your last payment didn’t go through. You can update your card in the app under Me → Billing. Thanks!`,
      congrats: `${f}! Your next session is workout #50 with me. That’s 50 times you showed up. Huge. 🎉`,
      'lead-followup': `Hi ${f}, thanks for reaching out! I’d love to hear more about your goals. Do you have 20 minutes this week for a free call? Here’s my calendar: onejumpfit.com/coach/dani`,
      'reply-last': {
        c1: `Totally normal after a harder leg day, especially with less sleep. It should ease in 2–3 days. I’ve trimmed this week’s leg volume a bit. If it ever feels sharp or like pain rather than soreness, tell me.`,
        c5: `Yes, that’s exactly the right kind of sore, ${f}! It means your glutes are doing the work. It should fade in a day or two. Great job on Day 2.`,
        c8: `Thanks for flagging it. Please don’t push through sharp knee pain. ${SafetyGuard.referral} We’ll keep training everything else in the meantime.`,
        _: `Thanks ${f}, got it. I’ll get back to you shortly with a plan.`,
      },
    };
    let t = T[intent] ?? T.professional;
    if (typeof t === 'object') t = t[c?.id] ?? t._;
    if (intent === 'shorter') {
      const src = current || T.professional;
      const s = src.match(/[^.!?]+[.!?]+/g) || [src];
      t = s.slice(0, Math.max(1, Math.ceil(s.length / 2))).join(' ').trim();
    }
    return { text: t, safety: SafetyGuard.check(t) };
  },

  risk(c) {
    const r = c.risk; const f = first(c);
    const ex = {
      c2: `${f} has gone quiet. She’s missed 3 workouts in two weeks, skipped last week’s check-in and is messaging far less than usual. Her rotating night shifts started around the same time, so the program may no longer fit her week.`,
      c3: `${f} is the most likely client to cancel. He’s missed 5 workouts, hasn’t checked in for two weeks, his last payment failed, and his last message expressed doubt. He’s 24 days in, which is when early dropouts usually happen.`,
      c15: `${f}’s engagement is slipping: two missed workouts, a late check-in and fewer messages, while her weight has stalled for two weeks. Nothing alarming, but a personal touch now is cheaper than a win-back later.`,
      c18: `${f} is two weeks in with two missed sessions and a failed payment from an expired card. The payment issue is probably an oversight; the missed sessions are the thing to ask about.`,
      c6: `${f} is still training but frustrated by a four-week plateau, and his travel weeks are hurting nutrition. Frustration plus a stall is a common reason people quit.`,
    };
    const act = {
      c2: 'Send Sarah a supportive message and ask whether her current program is still realistic.',
      c3: 'Offer Marcus a short call and a lighter plan built around his work hours. Sort the payment after the conversation, not before.',
      c15: 'Offer Grace Sunday check-ins and shorter sessions for a few weeks.',
      c18: 'Ask Kevin what’s been hardest to fit in. The card-update reminder already went out.',
      c6: 'Book a 15-minute call to plan travel weeks; reply to his check-in first.',
    };
    return { ...r, explanation: ex[c.id] || `${f} shows a few early warning signs worth a quick check-in.`, action: act[c.id] || `Send ${f} a quick personal check-in.`, draft: MockTemplates.message({ intent: 'risk', client: c }).text };
  },

  adjust(c) {
    if (c.id === 'c1') return { items: [
      { text: 'Mike has reported high soreness for two consecutive weeks. Consider reducing lower-body volume this week.', change: 'Goblet squat 3 → 2 sets · RDL 3 → 2 sets · Split squat 3 → 2 sets', why: 'Soreness 8/10 twice, sleep down 0.7 h' },
      { text: 'His goblet squat has been at 55 lb for 2 weeks at RPE 7. When soreness settles, consider moving to 60 lb.', change: 'Week 7: Goblet squat 60 lb', why: 'Two sessions at RPE ≤ 7' },
    ] };
    if (c.id === 'c8') return { items: [{ text: 'Chris reported knee pain in squats. Assist won’t suggest loading the knee until he’s been assessed by a qualified professional.', change: 'Your decision: pause back squats; optional box squat to pain-free depth', why: 'Pain reported in check-in' }] };
    if (c.id === 'c2') return { items: [{ text: 'Sarah completed 52% of sessions on 4 days a week. Consider 3 shorter sessions while her shifts rotate.', change: '4 × 60 min → 3 × 40 min, keep deadlift priority', why: '3 missed workouts in 14 days' }] };
    return { items: [{ text: `${first(c)} is on track. No changes suggested this week.`, change: 'None', why: `Adherence ${c.adherence}%` }] };
  },

  progress(c) {
    const w = c.weight, weeks = w.length - 1 || 1, dw = weightDelta(c);
    const lift = c.lift, lg = lift.vals[lift.vals.length - 1] - lift.vals[0];
    const out = [];
    if (dw < -1) out.push({ tone: 'good', title: `Down ${Math.abs(dw)} lb in ${weeks} weeks`, text: `About ${(Math.abs(dw) / weeks).toFixed(1)} lb a week, or ${(Math.abs(dw) / weeks / w[0] * 100).toFixed(1)}% of body weight per week.` });
    else if (c.signals?.plateau >= 3) out.push({ tone: 'warn', title: `Weight flat for ${c.signals.plateau} weeks`, text: `Within 0.5 lb since ${fmtDate(daysAgo(c.signals.plateau * 7))} while workouts continued. Nutrition on travel days is the likeliest lever; check with ${first(c)} before changing anything.` });
    else if (dw > 1) out.push({ tone: 'info', title: `Up ${dw} lb in ${weeks} weeks`, text: c.goalType === 'Muscle' || c.goalType === 'Strength' ? 'In line with a muscle or strength goal.' : 'Worth a conversation if fat loss is the goal.' });
    if (lg > 0) out.push({ tone: 'good', title: `${lift.name} up ${lg}${lift.name.includes('(in)') ? ' in' : ' lb'}`, text: `${lift.vals[0]} → ${lift.vals[lift.vals.length - 1]} over the same period (${Math.round(lg / Math.max(1, lift.vals[0]) * 100)}%).` });
    out.push({ tone: c.adherence >= 80 ? 'good' : c.adherence >= 65 ? 'warn' : 'crit', title: `Adherence ${c.adherence}% over 4 weeks`, text: c.adherence >= 80 ? 'Consistent. Progress is coming from showing up.' : 'Consistency is the main thing to work on before changing the program.' });
    if (c.waist) { const d = Math.round((c.waist[1] - c.waist[0]) * 10) / 10; if (d) out.push({ tone: d < 0 ? 'good' : 'info', title: `Waist ${d < 0 ? 'down' : 'up'} ${Math.abs(d)} in`, text: 'From the first and latest measurements.' }); }
    return { items: out, note: 'Based only on data logged in OneJump. Assist describes trends; it doesn’t make medical or body-composition claims.' };
  },

  workout(b) {
    const eq = new Set(b.equipment);
    const has = e => e.equipment === 'Bodyweight' || e.equipment === 'Band' || eq.has(e.equipment) || (eq.has('Full gym'));
    const knee = /knee/i.test(b.injuries || '');
    const shoulder = /shoulder/i.test(b.injuries || '');
    const r = rng((b.seed || 1) * 97 + b.minutes);
    let pool = DB.exercises.filter(has);
    if (knee) pool = pool.filter(e => e.knee !== 'knee');
    if (shoulder) pool = pool.filter(e => !['e21', 'e24', 'e17'].includes(e.id));
    if (b.prefs) { const avoid = b.prefs.toLowerCase(); pool = pool.filter(e => !avoid.includes('no ' + e.name.toLowerCase())); }
    const pick = (pats, n = 1) => { const c = pool.filter(e => pats.includes(e.pattern)); const out = []; while (out.length < n && c.length) out.push(c.splice(Math.floor(r() * c.length), 1)[0]); return out; };
    const n = b.minutes <= 30 ? 4 : b.minutes <= 45 ? 5 : b.minutes <= 60 ? 6 : 7;
    const goal = b.goal;
    let order = goal === 'Athletic performance' ? [['jump'], ['squat', 'lunge'], ['hinge'], ['push'], ['pull'], ['core', 'carry'], ['cardio']]
      : [['squat', 'lunge'], ['hinge'], ['push'], ['pull'], ['lunge', 'squat'], ['core', 'carry'], ['cardio', 'iso']];
    let exs = order.slice(0, n).flatMap(p => pick(p));
    const beginner = b.level === 'Beginner';
    const scheme = {
      'Fat loss': { sets: beginner ? 2 : 3, reps: '10–12', rpe: '7', rest: '60' },
      'Strength': { sets: beginner ? 3 : 4, reps: '5', rpe: '7–8', rest: '150' },
      'Muscle gain': { sets: beginner ? 3 : 4, reps: '8–12', rpe: '8', rest: '90' },
      'Athletic performance': { sets: 3, reps: '5', rpe: '7', rest: '120' },
      'General fitness': { sets: beginner ? 2 : 3, reps: '8–10', rpe: '7', rest: '75' },
    }[goal] || { sets: 3, reps: '10', rpe: '7', rest: '75' };
    const blocks = [];
    exs.forEach((e, i) => {
      const isAcc = i >= 3, isJump = e.pattern === 'jump', isCardio = e.pattern === 'cardio';
      const reps = isJump ? '5' : isCardio ? '6 × 30 s' : e.pattern === 'carry' ? '40 m' : e.pattern === 'core' ? '8 each side' : isAcc && goal === 'Strength' ? '8–10' : scheme.reps;
      const sets = Array.from({ length: isCardio ? 1 : scheme.sets }, () => ({ reps, load: e.equipment === 'Bodyweight' ? 'BW' : '', rpe: isCardio ? '8' : scheme.rpe, rest: isAcc ? '60' : scheme.rest }));
      blocks.push({ id: uid('b'), kind: 'single', items: [{ id: uid('i'), ex: e.id, tempo: i < 2 && goal !== 'Athletic performance' ? '3-0-1' : '', notes: knee && e.pattern === 'squat' ? 'Pain-free range only' : '', sets }] });
    });
    /* pair the last two accessories as a superset to save time */
    if (blocks.length >= 5 && b.minutes <= 60) { const a = blocks.splice(3, 2); blocks.splice(3, 0, { id: uid('b'), kind: 'superset', items: [a[0].items[0], a[1].items[0]] }); }
    const notes = [];
    if (knee) notes.push('Knee limitation noted: deep knee-bending and jumping exercises were left out. If the client has pain, they should see a qualified professional; this isn’t a rehab plan.');
    if (shoulder) notes.push('Shoulder limitation noted: overhead pressing and dips were left out.');
    return {
      name: `${goal === 'Fat loss' ? 'Full-body conditioning' : goal === 'Strength' ? 'Strength day' : goal === 'Athletic performance' ? 'Power + strength' : goal === 'Muscle gain' ? 'Hypertrophy day' : 'Full-body session'} · ${b.minutes} min`,
      est: b.minutes, blocks,
      rationale: `${scheme.sets} working sets of ${scheme.reps} at RPE ${scheme.rpe} suits a ${b.level.toLowerCase()} client focused on ${goal.toLowerCase()}. Big movements come first while fresh; accessories are paired to fit ${b.minutes} minutes.`,
      notes,
    };
  },

  program(prompt) {
    const p = prompt.toLowerCase();
    const weeks = +(p.match(/(\d+)\s*-?\s*week/)?.[1] || 8);
    const days = +(p.match(/(\d)\s*(?:days?|x)\s*(?:per|a|\/)?\s*week/)?.[1] || p.match(/(\d)\s*days/)?.[1] || 3);
    const age = +(p.match(/(\d{2})\s*-?\s*year/)?.[1] || 0);
    const level = /beginner|new to|never/.test(p) ? 'Beginner' : /advanced/.test(p) ? 'Advanced' : 'Intermediate';
    const goal = /fat|weight loss|lose/.test(p) ? 'Fat loss' : /strength|strong/.test(p) ? 'Strength' : /muscle|hypertroph/.test(p) ? 'Muscle gain' : /jump|vertical|athlet|sport/.test(p) ? 'Athletic performance' : 'General fitness';
    const equip = /dumbbell/.test(p) && /only/.test(p) ? 'Dumbbells only' : /home|bodyweight/.test(p) ? 'Home / bodyweight' : 'Full gym';
    const split = days >= 4 ? ['Lower A', 'Upper A', 'Lower B', 'Upper B'].slice(0, days) : days === 3 ? ['Full body A', 'Full body B', 'Full body C'] : ['Full body A', 'Full body B'];
    const dbOnly = equip === 'Dumbbells only';
    const lib = {
      'Lower A': [dbOnly ? 'Goblet squat 3×10' : 'Back squat 3×8', 'Romanian deadlift 3×10', 'Split squat 2×10/side', 'Dead bug 3×8/side'],
      'Upper A': ['Dumbbell bench press 3×10', 'One-arm dumbbell row 3×10/side', 'Seated dumbbell press 2×10', 'Dumbbell curl 2×12'],
      'Lower B': [dbOnly ? 'Dumbbell RDL 3×10' : 'Trap bar deadlift 3×6', 'Step-up 3×10/side', 'Hip thrust 3×12', 'Farmer carry 3×40 m'],
      'Upper B': ['Incline dumbbell press 3×10', 'Chest-supported row 3×12', 'Push-up 2×AMRAP', 'Band pull-apart 2×15'],
      'Full body A': ['Goblet squat 3×10', 'Dumbbell bench press 3×10', 'One-arm dumbbell row 3×10/side', 'Dead bug 2×8/side'],
      'Full body B': ['Romanian deadlift 3×10', 'Seated dumbbell press 3×10', 'Split squat 2×8/side', 'Farmer carry 3×40 m'],
      'Full body C': ['Step-up 3×10/side', 'Push-up 3×AMRAP', 'Chest-supported row 3×12', 'Plank 3×30 s'],
    };
    const ph = weeks >= 8 ? [
      { w: `1–2`, name: 'Learn the patterns', focus: 'Technique, RPE 6–7, 2–3 sets' },
      { w: `3–${Math.round(weeks * .6)}`, name: 'Build', focus: 'Add reps, then load; RPE 7–8' },
      { w: `${Math.round(weeks * .6) + 1}–${weeks - 1}`, name: 'Push', focus: 'Heavier top sets, conditioning finishers' },
      { w: `${weeks}`, name: 'Deload and retest', focus: 'Volume down 40%, retest key lifts' },
    ] : [{ w: `1–${weeks}`, name: 'Build', focus: 'Steady progression' }];
    const notes = ['Progression: when all sets hit the top of the rep range at RPE ≤ 7, add 5 lb (upper) or 10 lb (lower) next session.'];
    if (goal === 'Fat loss') notes.push('Add 2–3 daily-step or walking targets; nutrition targets are set by you, not Assist.');
    if (age >= 50) notes.push('Client is over 50: check for medical clearance and joint history during onboarding.');
    notes.push('Screen for injuries before publishing. Assist doesn’t replace a medical assessment.');
    return { title: `${weeks}-week ${level.toLowerCase()} ${goal.toLowerCase()} · ${days} days/week`, weeks, days, level, goal, equip, age, phases: ph, templates: split.map(s => ({ name: s, items: lib[s] })), notes };
  },

  business({ question, ctx }) { return BusinessAnswers.answer(question, ctx); },
};

   CORE — state, router, shells, modal/drawer/toast, prototype menu
   ============================================================ */
const V = {};        // views: V.name = { render(params) -> html, mount?(root, params) }
const Act = {};      // click actions: data-act="name"

const App = {
  state: {
    route: 'landing', params: {}, plan: 'pro', stageTags: true, theme: 'system',
    savedMin: 220, queue: {}, ui: {}, proto: false, notif: false,
  },
  history: [],
  go(route, params = {}, opts = {}) {
    if (!opts.replace && this.state.route) this.history.push([this.state.route, this.state.params]);
    this.state.route = route; this.state.params = params;
    document.body.classList.remove('rail-open');
    this.state.proto = false;
    this.render();
    if (!opts.keepScroll) { window.scrollTo(0, 0); const m = document.querySelector('.main'); if (m) m.scrollTop = 0; }
    try { const tok = route + (params.id ? '-' + params.id : ''); history.replaceState(null, '', '#' + tok); } catch (e) { }
  },
  back() { const h = this.history.pop(); if (h) { this.state.route = h[0]; this.state.params = h[1]; this.render(); } },
  ui(key, def) { if (!(key in this.state.ui)) this.state.ui[key] = typeof def === 'function' ? def() : def; return this.state.ui[key]; },
  setUi(key, val) { this.state.ui[key] = val; },
  save(min) { this.state.savedMin += min; const el = document.getElementById('saved-time'); if (el) el.textContent = fmtSaved(this.state.savedMin); },
  rerender() { const y = window.scrollY; this.render(); window.scrollTo(0, y); },
  render() {
    const r = ROUTES[this.state.route] || ROUTES.today;
    AuthService.as(r.shell === 'client' ? 'client' : r.shell === 'admin' ? 'admin' : 'trainer');
    document.body.className = (r.shell === 'client' ? 'client-view ' : r.shell === 'public' ? 'public-view ' : '') + (this.state.stageTags ? '' : 'no-stage');
    const view = V[r.view];
    const inner = view.render(this.state.params);
    let html;
    if (r.shell === 'trainer') html = trainerShell(r, inner);
    else if (r.shell === 'admin') html = adminShell(inner);
    else html = inner;
    document.getElementById('app').innerHTML = html + protoMenu();
    if (view.mount) view.mount(document.getElementById('app'), this.state.params);
    document.title = 'OneJump';
  },
};
function fmtSaved(m) { return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`; }
