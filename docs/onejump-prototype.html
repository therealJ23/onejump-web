/* ---------- modal / drawer / toast ---------- */
function openModal(html, { wide = false, onMount } = {}) {
  closeModal();
  const s = document.createElement('div');
  s.className = 'scrim'; s.id = 'modal';
  s.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener('mousedown', e => { if (e.target === s) closeModal(); });
  document.body.appendChild(s);
  const f = s.querySelector('input, textarea, select, button.primary'); if (f) setTimeout(() => f.focus(), 30);
  if (onMount) onMount(s);
  return s;
}
function closeModal() { document.getElementById('modal')?.remove(); }
function modalHead(title, sub = '') { return `<div class="modal-head"><div class="stack s4"><div class="h2">${title}</div>${sub ? `<div class="muted small">${sub}</div>` : ''}</div><button class="btn ghost icon sm" data-act="closeModal" aria-label="Close">${icon('x')}</button></div>`; }
function openDrawer(html) {
  closeDrawer();
  const d = document.createElement('aside'); d.className = 'drawer'; d.id = 'drawer'; d.innerHTML = html;
  document.body.appendChild(d);
  return d;
}
function closeDrawer() { document.getElementById('drawer')?.remove(); }
function toast(msg, { undo, assist = false, ms = 3800 } = {}) {
  let box = document.querySelector('.toasts');
  if (!box) { box = document.createElement('div'); box.className = 'toasts'; box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `${assist ? arc() : icon('check')}<span>${esc(msg)}</span>${undo ? '<button>Undo</button>' : ''}`;
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  box.appendChild(t); setTimeout(() => t.remove(), ms);
}

/* ---------- delegated events ---------- */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go && !go.disabled) {
    e.preventDefault();
    const p = {}; if (go.dataset.id) p.id = go.dataset.id; if (go.dataset.tab) p.tab = go.dataset.tab;
    closeModal(); closeDrawer();
    App.go(go.dataset.go, p); return;
  }
  const a = e.target.closest('[data-act]');
  if (a && Act[a.dataset.act] && !a.disabled) { e.preventDefault(); Act[a.dataset.act](a, e); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-act-input]'); if (el && Act[el.dataset.actInput]) Act[el.dataset.actInput](el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-act-change]'); if (el && Act[el.dataset.actChange]) Act[el.dataset.actChange](el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.getElementById('modal')) closeModal(); else if (document.getElementById('drawer')) closeDrawer(); else if (App.state.proto) Act.proto(); }
  if ((e.key === 'k' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); Act.copilot(); }
  if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { const s = document.getElementById('global-search'); if (s) { e.preventDefault(); s.focus(); } }
});

Object.assign(Act, {
  proto() { App.state.proto = !App.state.proto; const y = window.scrollY; document.querySelector('.proto-sheet')?.remove(); document.querySelector('.proto-fab')?.remove(); document.getElementById('app').insertAdjacentHTML('beforeend', protoMenu()); window.scrollTo(0, y); },
  setPlan(el) { App.state.plan = el.dataset.plan; App.state.proto = true; App.rerender(); toast(`Viewing as a ${el.dataset.plan[0].toUpperCase() + el.dataset.plan.slice(1)} coach`); },
  setTheme(el) { App.state.theme = el.dataset.themeVal; applyTheme(); App.state.proto = true; App.rerender(); },

  stageTags() { App.state.stageTags = !App.state.stageTags; App.state.proto = true; App.rerender(); },

function buildQueue() {
  const d = D(), cl = id => d.client(id);
  const missing = d.clients().filter(c => c.checkin === 'missing');
  const failed = d.payments().filter(p => p.status === 'failed');
  const review = d.checkins().filter(k => k.status === 'review');
  const items = [];
  if (review.length) items.push({ id: 'q-checkins', cat: 'clients', sev: 'assist', icon: 'clipboard', title: `${plural(review.length, 'check-in')} ready for review`, sub: `${review.map(k => first(cl(k.client))).join(', ')}. Summaries and replies are drafted. Chris mentions knee pain, so read his first.`, actions: [{ label: 'Review check-ins', go: 'checkins', primary: true }], mins: 0 });
  const marcus = cl('c3');
  if (marcus) items.push({ id: 'q-marcus', cat: 'clients', sev: 'crit', icon: 'alert', client: marcus, title: 'Marcus Johnson may cancel', sub: marcus.risk.reasons.slice(0, 3).join(' · '), draft: MockTemplates.message({ intent: 'risk', client: marcus }).text, actions: [{ label: 'Approve & send', act: 'qApprove', primary: true }, { label: 'Edit', act: 'qEdit' }, { label: 'Open profile', go: 'client', id: 'c3' }], mins: 12 });
  const sarah = cl('c2');
  if (sarah) items.push({ id: 'q-sarah', cat: 'clients', sev: 'warn', icon: 'alert', client: sarah, title: 'Sarah Kim is drifting', sub: sarah.risk.reasons.slice(0, 3).join(' · '), draft: MockTemplates.message({ intent: 'risk', client: sarah }).text, actions: [{ label: 'Approve & send', act: 'qApprove', primary: true }, { label: 'Edit', act: 'qEdit' }, { label: 'Dismiss', act: 'qDismiss' }], mins: 10 });
  if (failed.length) items.push({ id: 'q-pay', cat: 'money', sev: 'warn', icon: 'card', title: `${plural(failed.length, 'payment')} failed · ${money(sum(failed.map(p => p.amount)))}`, sub: failed.map(p => `${first(cl(p.client))} (${p.reason.split(':')[0].toLowerCase()})`).join(', ') + '. Card-update reminders are ready.', actions: [{ label: 'Send reminders', act: 'qApprove', primary: true }, { label: 'Open payments', go: 'payments' }], mins: 6 });
  if (missing.length) items.push({ id: 'q-missing', cat: 'clients', sev: 'assist', icon: 'clock', title: `${plural(missing.length, 'client')} haven’t checked in`, sub: missing.map(first).join(', ') + '. Due Sunday. A friendly reminder is drafted for each.', draft: MockTemplates.message({ intent: 'checkin-reminder', client: missing[0] }).text.replace(first(missing[0]), '{first name}'), actions: [{ label: `Send ${missing.length} reminders`, act: 'qApprove', primary: true }, { label: 'Edit', act: 'qEdit' }], mins: 2 * missing.length });
  items.push({ id: 'q-sam', cat: 'clients', sev: 'assist', icon: 'layers', title: 'Sam’s program ends in 6 days', sub: 'Assist drafted Strength Base · Phase 2 (4 weeks) from his last block: bench top sets 215 → 225 lb.', actions: [{ label: 'Review block', act: 'qProgram', primary: true }, { label: 'Dismiss', act: 'qDismiss' }], mins: 25 });
  const elena = cl('c4');
  items.push({ id: 'q-elena', cat: 'clients', sev: 'good', icon: 'trophy', client: elena, title: 'Elena hits workout #50 next session', sub: 'From your “milestone” automation. Approve to send after she logs it.', draft: MockTemplates.message({ intent: 'congrats', client: elena }).text, actions: [{ label: 'Approve', act: 'qApprove', primary: true }, { label: 'Edit', act: 'qEdit' }], mins: 3 });
  items.push({ id: 'q-leads', cat: 'growth', sev: 'info', icon: 'funnel', title: '2 new leads to answer', sub: 'Jake Morris (Instagram) and Maria Lopez (booking page). Follow-ups drafted.', actions: [{ label: 'Review drafts', go: 'leads', primary: true }], mins: 0 });
  return items;
}

Act.rewrite = async el => {

function ciRow(k, sel) {
  const c = D().client(k.client), flag = SafetyGuard.check(k.text).flagged;
  return `<div class="li click sev ${flag ? 'crit' : k.status === 'review' ? 'assist' : ''}" ${sel && sel.id === k.id ? 'style="background:var(--surface-2)"' : ''} data-go="checkins" data-id="${k.id}">${avatar(c, 'sm')}<div class="grow"><div class="strong small">${esc(c.name)}</div><div class="tiny muted">${flag ? '<span style="color:var(--crit);font-weight:700">Pain mentioned</span> · ' : ''}${rel(k.submitted)}</div></div>${k.status === 'reviewed' ? `<span style="color:var(--good)">${icon('check')}</span>` : icon('chevR')}</div>`;
}
function metric(label, val, prev, unit = '', goodUp = true) {
  let d = '';
  if (prev != null && prev !== val) { const up = val > prev, good = up === goodUp; d = `<span class="tiny ${good ? 'delta up' : 'delta down'}">${up ? '↑' : '↓'} ${Math.abs(Math.round((val - prev) * 10) / 10)}</span>`; }
  return `<div class="stat" style="padding:12px 14px"><div class="eyebrow">${label}</div><div class="row" style="gap:6px"><span class="strong" style="font-size:1.15rem">${val}${unit}</span>${d}</div></div>`;
}
function ciDetail(k) {
  if (!k) return `<div class="empty">${arc()}<div>No check-ins this week yet.</div></div>`;
  const c = D().client(k.client), safety = SafetyGuard.check(k.text);
  const prevW = c.weight[c.weight.length - 2];
  return `
  <div class="card-head"><div class="row">${avatar(c, 'md')}<div><div class="h3">${esc(c.name)}</div><div class="tiny muted">Week ${c.week} of ${progOf(c).name} · sent ${rel(k.submitted).toLowerCase()}</div></div></div><button class="btn sm" data-go="client" data-id="${c.id}">Profile</button></div>
  ${safety.flagged ? `<div class="pad-sm row top" style="background:var(--crit-tint);border-bottom:1px solid var(--line)"><span style="color:var(--crit)">${icon('alert')}</span><div class="small"><b>Pain reported.</b> Assist won’t suggest training through it and has drafted a reply recommending a physical therapist or sports-medicine doctor. You decide what happens next.</div></div>` : ''}
  <div class="stat-row" style="border-bottom:1px solid var(--line)">
    ${metric('Workouts', `${k.workouts[0]}/${k.workouts[1]}`, null)}
    ${metric('Weight', k.weight, prevW, ' lb', c.goalType !== 'Fat loss')}
    ${metric('Sleep', k.sleep, k.prev.sleep, ' h')}
    ${metric('Energy', k.energy, k.prev.energy, '/10')}
    ${metric('Soreness', k.soreness, k.prev.soreness, '/10', false)}
    ${metric('Stress', k.stress, null, '/10')}
    ${metric('Nutrition', k.nutrition, null, '/10')}
    ${metric('Mood', k.mood, null, '/10')}
  </div>
  <div class="pad stack s16">
    <div class="stack s8"><div class="eyebrow">In ${esc(first(c))}’s words</div><blockquote style="margin:0;padding:12px 16px;border-left:3px solid var(--line-strong);background:var(--surface-2);border-radius:0 10px 10px 0">${esc(k.text)}</blockquote></div>
    <div class="assist-card pad stack s16" id="ci-ai">${thinking('Assist is summarizing the week…')}${skeleton(3)}</div>
  </div>`;
}
async function loadCheckinAI(k) {

    </div>
    <div class="stack s8"><div class="strong small">Reply to ${esc(first(c))}</div>${editorBlock('ci', r.reply, c)}</div>
    <div class="row wrap"><button class="btn primary" data-act="ciSend" data-k="${k.id}" ${done ? 'disabled' : ''}>${icon('send')} ${done ? 'Reviewed' : 'Send reply & mark reviewed'}</button><button class="btn" data-act="ciMark" data-k="${k.id}" ${done ? 'disabled' : ''}>Mark reviewed without reply</button></div>`;
}
Object.assign(Act, {
  ciAction(el) { const b = document.querySelector(`[data-ci-act="${el.dataset.i}"]`); b.innerHTML = `<span class="small row">${icon('check')} Done</span>`; App.save(+el.dataset.mins || 5); toast('Applied'); },
  ciSkip(el) { document.querySelector(`[data-ci-act="${el.dataset.i}"]`)?.remove(); },
  ciSend(el) {
    const k = DB.checkins.find(x => x.id === el.dataset.k); const txt = document.getElementById('ci-text').value;
    k.status = 'reviewed'; const c = Data.raw(k.client); c.checkin = 'reviewed';
    const th = DB.threads.find(t => t.client === c.id); if (th) th.msgs.push(['me', 'Today', 'Now', txt]);
    App.state.queue['q-checkins'] = D().checkins().some(x => x.status === 'review') ? undefined : 'approved';
    if (!App.state.queue['q-checkins']) delete App.state.queue['q-checkins'];
    App.save(8); const next = D().checkins().find(x => x.status === 'review');
    toast(`Reply sent to ${first(c)}`);
    App.go('checkins', next ? { id: next.id } : { id: k.id }, { replace: true });
  },
  ciMark(el) { const k = DB.checkins.find(x => x.id === el.dataset.k); k.status = 'reviewed'; Data.raw(k.client).checkin = 'reviewed'; App.rerender(); toast('Marked reviewed'); },
  remindOne(el) { const c = Data.raw(el.dataset.client); c.reminded = true; App.rerender(); toast(`Reminder sent to ${first(c)}`); App.save(2); },
  remindAll() { const m = D().clients().filter(c => c.checkin === 'missing' && !c.reminded); m.forEach(c => c.reminded = true); App.rerender(); toast(`${plural(m.length, 'reminder')} sent`); App.save(2 * m.length); },
});

Object.assign(Act, {

V.builder = {

function itemCard(b, it, label) {
  const e = DB.exercises.find(x => x.id === it.ex);
  return `<div class="block" data-item="${it.id}">
    <div class="block-head"><span class="block-letter">${label}</span><span class="thumb" style="width:34px;height:34px">${icon('play')}</span><div class="grow" style="min-width:0"><div class="strong">${esc(e.name)}</div><div class="tiny muted">${esc(e.muscle)} · ${esc(e.equipment)}${e.knee === 'knee' ? ' · knee-intensive' : ''}</div></div>
      <button class="btn ghost icon sm" data-act="swapEx" data-item="${it.id}" aria-label="Swap exercise" title="Swap for an alternative">${icon('swap')}</button>

    <div style="padding:0 14px 12px;overflow-x:auto"><table class="sets"><thead><tr><th>Set</th><th>Reps</th><th>Load</th><th>RPE</th><th>Rest (s)</th><th></th></tr></thead><tbody>
      ${it.sets.map((s, si) => `<tr><td class="tiny strong muted" style="width:36px">${si + 1}</td>${['reps', 'load', 'rpe', 'rest'].map(f => `<td><input aria-label="Set ${si + 1} ${f}" value="${esc(s[f])}" data-act-input="setEdit" data-item="${it.id}" data-si="${si}" data-f="${f}"></td>`).join('')}<td style="width:30px"><button class="btn ghost icon xs" style="width:26px" data-act="delSet" data-item="${it.id}" data-si="${si}" aria-label="Remove set">${icon('x')}</button></td></tr>`).join('')}
    </tbody></table>
    <div class="row wrap" style="margin-top:8px;gap:8px"><button class="btn ghost xs" data-act="addSet" data-item="${it.id}">${icon('plus')} Set</button><label class="row tiny muted" style="gap:6px">Tempo <input class="input sm" style="width:90px" value="${esc(it.tempo)}" placeholder="3-1-1" data-act-input="itemEdit" data-item="${it.id}" data-f="tempo"></label><label class="row tiny muted grow" style="gap:6px;min-width:180px">Notes <input class="input sm grow" value="${esc(it.notes)}" placeholder="Coaching cue for the client" data-act-input="itemEdit" data-item="${it.id}" data-f="notes"></label></div></div>
  </div>`;
}
function findItem(id) { for (const b of DB.workout.blocks) { const it = b.items.find(i => i.id === id); if (it) return { b, it }; } return {}; }
function builderDnD(root) {
  let dragEx = null, dragBlock = null;
  root.querySelectorAll('.lib-item').forEach(el => el.addEventListener('dragstart', e => { dragEx = el.dataset.ex; e.dataTransfer.setData('text/plain', dragEx); e.dataTransfer.effectAllowed = 'copy'; }));
  root.querySelectorAll('#blocks > [data-block]').forEach(el => {
    el.addEventListener('dragstart', e => { if (e.target.closest('input')) { e.preventDefault(); return; } dragBlock = el.dataset.block; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragBlock); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('over');
      const bl = DB.workout.blocks, to = bl.findIndex(b => b.id === el.dataset.block);
      if (dragBlock && dragBlock !== el.dataset.block) { const from = bl.findIndex(b => b.id === dragBlock); const [m] = bl.splice(from, 1); bl.splice(to, 0, m); App.rerender(); toast('Reordered'); }
      else if (dragEx) { bl.splice(to, 0, newBlock(dragEx)); App.rerender(); toast(`Added ${exName(dragEx)}`); }
      dragEx = dragBlock = null;
    });
  });
  const end = root.querySelector('#drop-end');
  if (end) { end.addEventListener('dragover', e => { e.preventDefault(); end.style.borderColor = 'var(--green)'; }); end.addEventListener('dragleave', () => end.style.borderColor = ''); end.addEventListener('drop', e => { e.preventDefault(); if (dragEx) { DB.workout.blocks.push(newBlock(dragEx)); App.rerender(); toast(`Added ${exName(dragEx)}`); } dragEx = null; }); }
}
function newBlock(ex) { return { id: uid('b'), kind: 'single', items: [{ id: uid('i'), ex, tempo: '', notes: '', sets: [1, 2, 3].map(() => ({ reps: '10', load: '', rpe: '7', rest: '75' })) }] }; }
Object.assign(Act, {

  },
  swapTo(el) { const { it } = findItem(el.dataset.item); const old = exName(it.ex); it.ex = el.dataset.ex; closeModal(); App.rerender(); toast(`${old} → ${exName(it.ex)}`); },

/* ---------- speech output (browser voice; works without a mic) ---------- */
const Speech = {
  supported: (() => { try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function'; } catch (e) { return false; } })(),
  speak(text, onEnd) {
    if (!this.supported || !App.ui('voiceSpeak', true)) { setTimeout(() => onEnd && onEnd(), Math.min(4000, 400 + text.length * 35)); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = speechSynthesis.getVoices().find(x => /en[-_]US/i.test(x.lang) && /female|samantha|aria|jenny|google us/i.test(x.name)) || speechSynthesis.getVoices().find(x => /^en/i.test(x.lang));
      if (v) u.voice = v;
      u.rate = 1.03; u.pitch = 1;
      let done = false; const fin = () => { if (!done) { done = true; onEnd && onEnd(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 1500 + text.length * 80);
      speechSynthesis.speak(u);
    } catch (e) { onEnd && onEnd(); }
  },
  stop() { try { speechSynthesis.cancel(); } catch (e) { } },
};
function plainText(html) { const d = document.createElement('div'); d.innerHTML = html; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
function spokenSummary(html, max = 240) {
  const t = plainText(html); const parts = t.match(/[^.!?:]+[.!?:]+/g) || [t]; let out = '';
  for (const p of parts) { if ((out + p).length > max) break; out += p; }
  return (out || t.slice(0, max)).replace(/:$/, '.').trim();
}
async function typeOut(el, text, ms = 1200, prop = 'textContent') {
  const words = text.split(' '), step = Math.max(35, ms / words.length);
  for (let i = 1; i <= words.length; i++) { if (!el.isConnected) return; el[prop] = words.slice(0, i).join(' '); await sleep(step); }
}

  const ta = document.getElementById(el.dataset.target); if (!ta || el.classList.contains('mic-live')) return;
  const text = DICTATION[el.dataset.ctx] || (el.dataset.ctx || '').startsWith('msg-') && 'Thanks for the update! I’ll take a look and get back to you today.' || DICTATION.reply;
  el.classList.add('mic-live'); const old = el.innerHTML; el.innerHTML = `${icon('mic')}<span class="hide-sm"> Listening…</span>`;
  const base = ta.value && !ta.value.endsWith(' ') ? ta.value + ' ' : ta.value;

  for (let i = 1; i <= words.length; i++) { ta.value = base + words.slice(0, i).join(' '); await sleep(70); }
  el.classList.remove('mic-live'); el.innerHTML = old;

};

  if (e.target.matches('[data-form="cchat"]')) {

    DB.threads.find(t => t.client === 'c1').msgs.push(['them', 'Today', 'Now', v]); Data.raw('c1').unread = 1;
    App.rerender(); const s = document.getElementById('cscroll'); s.scrollTop = s.scrollHeight;
  }
});

/* ---------- OneJump admin (internal) ---------- */
V.admin = {

    const a = DB.admin, aiPct = a.aiCost / a.mrr[11] * 100;

    return `
    <div class="page-head"><div><div class="eyebrow">OneJump HQ · sample data</div><h1 class="h1" style="margin-top:6px">Platform overview</h1><p class="sub">October 2026 · month to date</p></div><div class="seg"><button>30 days</button><button class="on">12 months</button></div></div>
    <section class="kpis">
      <div class="kpi"><span class="eyebrow">MRR</span><span class="big-num">${money(a.mrr[11])}</span><span class="delta up">↑ ${((a.mrr[11] / a.mrr[10] - 1) * 100).toFixed(1)}% vs Sep</span></div>
      <div class="kpi"><span class="eyebrow">Paying coaches</span><span class="big-num">${a.paying}</span><span class="tiny muted">${a.trials} in trial · ${a.trainers} total</span></div>
      <div class="kpi"><span class="eyebrow">Coach churn</span><span class="big-num">${a.churn}%</span><span class="tiny muted">monthly, logo</span></div>
      <div class="kpi"><span class="eyebrow">Clients on platform</span><span class="big-num">${a.clients.toLocaleString()}</span><span class="tiny muted">${Math.round(a.clients / a.trainers)} per coach</span></div>
    </section>
    <section class="kpis">
      <div class="kpi"><span class="eyebrow">New subscriptions</span><span class="big-num">${a.newSubs}</span><span class="tiny muted">this month</span></div>
      <div class="kpi"><span class="eyebrow">Failed payments</span><span class="big-num" style="color:var(--crit)">${a.failed}</span><span class="tiny muted">coaches paying OneJump</span></div>
      <div class="kpi"><span class="eyebrow">AI usage</span><span class="big-num">${(a.aiActions / 1000).toFixed(1)}k</span><span class="tiny muted">${money(a.aiCost)} cost · ${aiPct.toFixed(1)}% of MRR</span></div>
      <div class="kpi"><span class="eyebrow">Open support</span><span class="big-num">${a.support}</span><span class="tiny muted">median first reply 2h</span></div>
    </section>
    <div class="split">
      <section class="card pad stack s8"><div class="row between"><div class="h3">MRR growth</div><span class="tiny muted">USD</span></div>${lineChart({ labels: a.months, series: a.mrr, min: 0, fmt: v => '$' + (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v) })}</section>
      <div class="stack s16">
        <section class="card pad stack s16"><div class="h3">Plan mix</div>${[['Starter', a.mix.starter, 29], ['Pro', a.mix.pro, 59], ['Studio', a.mix.studio, 99]].map(([n, k, p]) => `<div class="stack s4"><div class="row between small"><span>${n} · $${p}</span><span class="strong">${k} coaches</span></div><div class="bar"><i style="width:${k / a.paying * 100}%"></i></div></div>`).join('')}<div class="tiny faint">Blended revenue per coach: ${money(a.mrr[11] / a.paying)}/mo</div></section>
        <section class="card pad stack s8"><div class="row between"><div class="h3">${arc()} AI usage by feature</div><span class="pill ${aiPct < 5 ? 'good' : 'warn'}">${aiPct < 5 ? 'Under 5% budget' : 'Over budget'}</span></div>${feats.map(([f, p]) => `<div class="hours-row" style="grid-template-columns:140px minmax(0,1fr) 40px"><span class="small">${f}</span><span class="b after" style="width:${p * 2.4}%"></span><span class="small num strong" style="text-align:right">${p}%</span></div>`).join('')}</section>
      </div>
    </div>
    <section class="card"><div class="card-head"><div class="h3">Coaches</div><span class="pill info">${icon('eyeOff')} Client names and details hidden</span></div><div class="table-wrap"><table class="t"><thead><tr><th>Business</th><th>Owner</th><th>Plan</th><th class="r">Clients</th><th class="r">MRR</th><th>Health</th><th>Last active</th></tr></thead><tbody>
      ${a.list.map(r => `<tr><td class="strong small nowrap">${r[0]}</td><td class="small nowrap">${r[1]}</td><td><span class="pill">${r[2]}</span></td><td class="r num small">${r[3]}</td><td class="r num small">$${r[4]}</td><td><span class="pill ${r[5] === 'Healthy' ? 'good' : r[5].includes('failed') ? 'crit' : 'warn'}">${r[5]}</span></td><td class="small muted nowrap">${r[6]}</td></tr>`).join('')}</tbody></table></div></section>

    </div>`;
  },
};

/* ---------- boot ---------- */
(function boot() {
  try { const h = (location.hash || '').slice(1); if (h) { const i = h.indexOf('-'); const r = i < 0 ? h : h.slice(0, i), id = i < 0 ? null : h.slice(i + 1); if (ROUTES[r]) { App.state.route = r; if (id) App.state.params = { id }; } } } catch (e) { }
  applyTheme();
  App.render();
})();

</script>
