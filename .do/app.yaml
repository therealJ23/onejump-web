# DigitalOcean App Platform spec. Create the app from this file (Apps → Create App →
# "Import from app spec") or with: doctl apps create --spec .do/app.yaml
# Secrets are left empty here on purpose: fill them in the App Platform dashboard.
name: onejump
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/onejump-app
      branch: main
      deploy_on_push: true
    build_command: npm ci
    run_command: npm start
    http_port: 3000
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - { key: NODE_ENV, value: production }
      - { key: PORT, value: "3000" }
      - { key: APP_URL, value: "https://onejumpfit.com" }
      - { key: DATABASE_URL, type: SECRET }
      - { key: MIGRATE_DATABASE_URL, type: SECRET }
      - { key: DATABASE_CA_CERT, type: SECRET }
      - { key: SESSION_SECRET, type: SECRET }
      - { key: AI_PROVIDER, value: anthropic }
      - { key: ANTHROPIC_API_KEY, type: SECRET }
      - { key: ANTHROPIC_MODEL, value: claude-haiku-4-5 }
      - { key: AI_MONTHLY_BUDGET_USD, value: "5" }
      - { key: PAYMENTS_PROVIDER, value: stripe }
      - { key: STRIPE_SECRET_KEY, type: SECRET }
      - { key: STRIPE_PUBLISHABLE_KEY, type: SECRET }
      - { key: STRIPE_WEBHOOK_SECRET, type: SECRET }
      - { key: STRIPE_CONNECT_WEBHOOK_SECRET, type: SECRET }
      - { key: STRIPE_PRICE_STARTER, type: SECRET }
      - { key: STRIPE_PRICE_PRO, type: SECRET }
      - { key: STRIPE_PRICE_STUDIO, type: SECRET }
      - { key: EMAIL_PROVIDER, value: resend }
      - { key: RESEND_API_KEY, type: SECRET }
      - { key: EMAIL_FROM, value: "OneJump <hello@onejumpfit.com>" }
      - { key: STORAGE_PROVIDER, value: r2 }
      - { key: R2_ACCOUNT_ID, type: SECRET }
      - { key: R2_ACCESS_KEY_ID, type: SECRET }
      - { key: R2_SECRET_ACCESS_KEY, type: SECRET }
      - { key: R2_BUCKET, value: onejump-private }
      - { key: JOBS_ENABLED, value: "true" }
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: YOUR_GITHUB_USERNAME/onejump-app
      branch: main
    build_command: npm ci
    run_command: npm run db:migrate
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, type: SECRET }
      - { key: MIGRATE_DATABASE_URL, type: SECRET }
      - { key: DATABASE_CA_CERT, type: SECRET }
      - { key: SESSION_SECRET, type: SECRET }
